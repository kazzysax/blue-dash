<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Blue Dash — 3D runner</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;top:16px;left:18px;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 6px #0008;letter-spacing:.5px}
  #hud span{color:#ffd23a}
  #over,#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:#0008;overflow-y:auto;padding:24px 0}
  #over{display:none}
  h1{font-size:54px;margin:0 0 8px;letter-spacing:-1px} h1 b{color:#2a7bff}
  p{opacity:.85;margin:6px 0;font-size:17px}
  button{margin-top:18px;font:800 20px Inter,system-ui;padding:14px 34px;border:0;border-radius:40px;background:#2a7bff;color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .lb{width:min(360px,86vw);margin:18px auto 0;background:#0b1220cc;border:1px solid #ffffff22;border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px)}
  .lb h2{font-size:13px;letter-spacing:2px;margin:0 0 8px;color:#9fc2ff;text-transform:uppercase;font-weight:800}
  .lb .row{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;font-size:15px}
  .lb .row.me{background:#2a7bff33;border:1px solid #2a7bff88}
  .lb .rk{width:22px;color:#ffd23a;font-weight:800;text-align:right}
  .lb .nm{flex:1;text-align:left;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb .sc{font-weight:800;color:#fff}
  .lb .empty{opacity:.6;font-size:14px;padding:8px 0}
  .submit{display:flex;gap:8px;width:min(360px,86vw);margin:14px auto 0}
  .submit input{flex:1;font:700 16px Inter,system-ui;padding:12px 14px;border-radius:12px;border:1px solid #ffffff33;background:#0b1220cc;color:#fff;outline:none}
  .submit input::placeholder{color:#ffffff66}
  .submit button{margin:0;padding:12px 18px;font-size:15px;border-radius:12px}
  #msg{font-size:14px;margin:8px 0 0;min-height:18px;color:#9fc2ff}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">RINGS <span id="rings">0</span> &nbsp; SCORE <span id="score">0</span></div>
<div id="start"><h1>BLUE <b>DASH</b></h1><p>← → or A/D to switch lanes · ↑ / Space to jump</p><p>Phone: drag — he follows your finger · flick up or tap to jump</p><button id="go" disabled>RUN</button><div class="lb" id="lb-start"><h2>🏆 Global Top 10</h2><div class="rows"></div></div></div>
<div id="over"><h1>WIPEOUT</h1><p id="final"></p><div class="submit"><input id="name" maxlength="16" placeholder="Your name" autocomplete="off" /><button id="submit">SUBMIT</button></div><div id="msg"></div><div class="lb" id="lb-over"><h2>🏆 Global Top 10</h2><div class="rows"></div></div><button id="again">RUN AGAIN</button></div>
<script type="module" src="./game.js?v=2"></script>
</body>
</html>
